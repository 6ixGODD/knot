[workspace]
members = ["crates/knot-schema", "crates/knot-core", "crates/knot-cli", "crates/knot-ffi", "crates/knot-rules", "crates/knot-rules-zen", "crates/knot-compiler"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
knot-schema = { path = "crates/knot-schema" }
knot-rules = { path = "crates/knot-rules" }
knot-compiler = { path = "crates/knot-compiler" }
knot-core = { path = "crates/knot-core" }
knot-rules-zen = { path = "crates/knot-rules-zen" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"
jsonschema = { version = "=0.58.6", default-features = false, features = ["arbitrary-precision"] }
zen-engine = { version = "=2.1.3", default-features = false, features = ["arbitrary_precision"] }
zen-expression = { version = "=2.1.3", default-features = false, features = ["arbitrary_precision"] }
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
