name: Service package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: 1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/knot-package-cache
          key: knot-linux-amd64-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/server/toolchain-lock.json') }}-${{ github.sha }}
          restore-keys: |
            knot-linux-amd64-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/server/toolchain-lock.json') }}-
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.4
          cache-dependency-path: examples/grpc/go/go.sum
      - name: Build service and complete runnable bundle once
        timeout-minutes: 30
        run: python tools/server/ci_package.py --out "$RUNNER_TEMP/knot-package" --cache "$RUNNER_TEMP/knot-package-cache"
      - name: Short checks and real container scenarios
        timeout-minutes: 5
        run: |
          node --test examples/grpc/go/cmd/speaker-web/web/app.test.mjs
          cd examples/grpc/go
          go test -p=2 -mod=readonly ./...
          cd ../../..
          IMAGE=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/knot-package/delivery/release.json"))["image"])')
          python examples/grpc/speaker_demo.py --image "$IMAGE" --out "$RUNNER_TEMP/knot-package/delivery/smoke"
          python tools/server/smoke_package.py --delivery "$RUNNER_TEMP/knot-package/delivery"
      - name: Downloadable service and example
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knot-service-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/knot-package/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
