name: Native SDK verification
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            machine: x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            machine: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            machine: arm64
          - os: macos-15
            target: aarch64-apple-darwin
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTDOCFLAGS: -D warnings
      PYTHONDONTWRITEBYTECODE: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.4
          cache: false
      - name: Fixed tools and isolated outputs
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'knot-native/cargo-target')" >> $env:GITHUB_ENV
          $version = & rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if ($version -notcontains 'host: ${{ matrix.target }}') { throw 'Unexpected Rust target' }
          python -c "import platform,struct,sys; machine=platform.machine().lower().replace('amd64','x86_64'); print(platform.platform(),machine,sys.version); assert machine == '${{ matrix.machine }}'; assert struct.calcsize('P') == 8; assert sys.version_info >= (3,11)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash Cargo.lock -Algorithm SHA256
          if ($IsWindows) {
            if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { throw 'Go cgo requires the runner GCC toolchain' }
          }
          go version
          cmake --version
      - name: Native gates
        run: python tools/verify/all.py --stage native --out "${{ runner.temp }}/knot-native/verify"
      - name: Candidate for isolated consumer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/knot-native/verify/package/*.zip
            ${{ runner.temp }}/knot-native/verify/package/package.json
            tests/package/consume.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/knot-native/verify/**/*.json
            ${{ runner.temp }}/knot-native/verify/**/*.log
            ${{ runner.temp }}/knot-native/verify/**/*.xml
  consumer:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: sdk-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Consume only this run's package without checkout or Rust installation
        shell: pwsh
        run: |
          $receipt = @(Get-ChildItem candidate -Filter package.json -Recurse)
          $script = @(Get-ChildItem candidate -Filter consume.py -Recurse)
          if ($receipt.Count -ne 1 -or $script.Count -ne 1) { throw 'Ambiguous artifact contents' }
          python $script[0].FullName --package-dir $receipt[0].Directory.FullName --out "${{ runner.temp }}/isolated-consumer"
          exit $LASTEXITCODE
      - name: Preserve consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/isolated-consumer/*.json
            ${{ runner.temp }}/isolated-consumer/*.log
  security:
    strategy:
      fail-fast: false
      matrix:
        gate: [fuzz, memory]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: 1
      KNOT_NIGHTLY: nightly-2026-08-29
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fixed security toolchain
        run: |
          rustup toolchain install nightly-2026-08-29 --profile minimal --component miri --component rust-src
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/knot-security/cargo-target" >> "$GITHUB_ENV"
      - name: Fixed fuzz tool
        if: matrix.gate == 'fuzz'
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/knot-security/install" cargo +nightly-2026-08-29 install cargo-fuzz --version 0.13.2 --locked
      - name: Native security gate
        run: python tools/verify/all.py --stage ${{ matrix.gate }} --out "$RUNNER_TEMP/knot-security/verify"
      - name: Preserve security evidence and crash corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/knot-security/verify/**/*.json
            ${{ runner.temp }}/knot-security/verify/**/*.log
            ${{ runner.temp }}/knot-security/verify/fuzz/artifacts/**
            ${{ runner.temp }}/knot-security/verify/fuzz/corpus/**
