name: P0 candidate evidence
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/knot-plan01/cargo-target
      RUSTDOCFLAGS: -D warnings
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fixed toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Contracts and shared components
        run: cargo test --workspace --locked
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Real native P0
        run: python tools/p0/run.py --out "${{ runner.temp }}/knot-plan01/p0"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/knot-plan01/p0/*.json
            ${{ runner.temp }}/knot-plan01/p0/*.xml
            ${{ runner.temp }}/knot-plan01/p0/*.log
            ${{ runner.temp }}/knot-plan01/p0/json-isolation/*.json
            ${{ runner.temp }}/knot-plan01/p0/json-isolation/*.xml
            ${{ runner.temp }}/knot-plan01/p0/json-isolation/*.log
