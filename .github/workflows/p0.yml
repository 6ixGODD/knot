name: P0 candidate evidence
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            machine: x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            machine: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTDOCFLAGS: -D warnings
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fixed toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'knot-p0/cargo-target')" >> $env:GITHUB_ENV
      - name: Verify actual architecture and tools
        run: |
          $version = & rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if ($version -notcontains 'host: ${{ matrix.target }}') { throw 'Unexpected Rust host target' }
          python -c "import platform,struct,sys,sysconfig; machine=(platform.machine() or sysconfig.get_platform().removeprefix('win-')).lower().replace('amd64','x86_64'); print(platform.platform(),machine,sys.version); assert machine == '${{ matrix.machine }}'; assert struct.calcsize('P') == 8; assert sys.version_info >= (3,11)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Real native P0
        run: python tools/p0/run.py --out "${{ runner.temp }}/knot-p0/p0"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Contracts and shared components
        run: cargo test --workspace --locked
      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/knot-p0/p0/*.json
            ${{ runner.temp }}/knot-p0/p0/*.xml
            ${{ runner.temp }}/knot-p0/p0/*.log
            ${{ runner.temp }}/knot-p0/p0/json-isolation/*.json
            ${{ runner.temp }}/knot-p0/p0/json-isolation/*.xml
            ${{ runner.temp }}/knot-p0/p0/json-isolation/*.log
