name: Publish GHCR release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Service package run ID
        required: true
        default: '39278666218'
permissions:
  contents: write
  actions: read
  packages: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Promote verified image, verify registry pull, and publish Release
        run: python tools/server/publish.py --out "$RUNNER_TEMP/knot-publish"
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghcr-publication-${{ github.sha }}
          path: ${{ runner.temp }}/knot-publish/release/
          if-no-files-found: warn
          retention-days: 7
