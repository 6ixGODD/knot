[package]
name = "knot-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
knot-schema.workspace = true
knot-core.workspace = true
knot-compiler.workspace = true
knot-rules-zen.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time", "signal"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "router", "codegen", "tls-ring", "tls-connect-info"] }
tonic-prost = "=0.14.6"
tonic-health = "=0.14.6"
prost = "=0.14.4"
clap = { version = "=4.6.7", features = ["derive", "env", "string"] }

tower = "=0.5.3"
http-body = "=1.1.0"
bytes = "=1.12.1"
tokio-stream = "=0.1.19"

rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
tonic-prost-build = "=0.14.6"

[dev-dependencies]
knot-rules.workspace = true
h2 = "=0.4.20"
prost-types = "=0.14.4"
