<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音箱配置</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><strong>KNOT · 音箱配置</strong><span id="connection">连接中</span><button id="reset" type="button">重新开始</button></header>
<main><section class="preview" aria-label="音箱预览"><div id="speaker"><div id="base-layer" class="layer"></div><div id="cabinet-layer" class="layer"></div><div id="panel-layer" class="layer"></div><div id="led-layer" class="layer" hidden></div></div><p id="material-label"></p></section>
<section class="configuration"><div class="price-row"><span id="price-status">完整配置总价</span><strong id="price">报价中…</strong></div><p id="price-note"></p><nav id="steps" aria-label="配置步骤"></nav><div id="error" role="alert" hidden></div><div id="question"></div><div class="navigation"><button id="back">上一项</button><button id="next">下一项</button></div><small id="revision"></small></section></main>
<details><summary>请求与响应</summary><span id="request-info"></span><pre id="raw"></pre></details></body></html>
